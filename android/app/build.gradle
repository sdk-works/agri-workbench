plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qinghe.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.qinghe.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/qinghe.jks")
            storePassword "qinghe123456"
            keyAlias "qinghe"
            keyPassword "qinghe123456"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯 WebView 壳，无第三方依赖
}
